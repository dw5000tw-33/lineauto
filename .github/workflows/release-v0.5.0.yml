name: Publish V0.5.0 release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.5.0.yml"
      - "downloads/setup-parts/**"
      - "downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reassemble and verify installer
        shell: bash
        run: |
          set -euo pipefail
          cat downloads/setup-parts/33Works-LINE-Workbench-Setup-V0.5.0.exe.part-{00,01,02,03} > downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe
          test "$(stat -c%s downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe)" -eq 2458065
          test "$(stat -c%s downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip)" -gt 0
          sha256sum downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip > downloads/SHA256SUMS.txt

      - name: Publish release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.5.0"
          TITLE="33 Works LINE 自動化工作台 V0.5.0"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "${NOTES_FILE}" <<'NOTES'
          ## V0.5.0

          - Windows 安裝版與 ZIP 免安裝版
          - 可指定好友或群組，傳送文字與圖片，設定排程
          - 通行碼驗證與單一裝置綁定
          - 自願支持入口

          執行排程時請保持 LINE 電腦版、工作台與電腦開啟。安裝檔目前沒有數位簽章。下載後可用隨附的 SHA256SUMS.txt 核對檔案。
          NOTES
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip downloads/SHA256SUMS.txt --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}" downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip downloads/SHA256SUMS.txt --title "${TITLE}" --notes-file "${NOTES_FILE}"
          fi

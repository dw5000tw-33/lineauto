name: Publish approved V0.5.0 files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.5.0.yml"
      - "downloads/approved-setup-parts/**"
      - "downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble and verify user-approved files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cat downloads/approved-setup-parts/setup.part-{00,01,02,03,04} > release-output/33Works-LINE-Workbench-Setup-V0.5.0.exe
          cp downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip release-output/
          cd release-output
          echo "7881a81ccd86ab7d9c0a52ffc8f69fed1a7793cb64fe6a1ebfea2fe0b74e8d51  33Works-LINE-Workbench-Setup-V0.5.0.exe" > SHA256SUMS.txt
          echo "77cfdbd8fa47d302db312ac059e844208c53f75cedaee9f90d0b7e4fe284fa05  33Works-LINE-Workbench-Portable-V0.5.0.zip" >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish exact approved installer and portable ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## V0.5.0 已確認面板

          安裝版與免安裝版均為使用者確認的檔案，沿用 V0.5.0 檔名。
          下載後可使用 SHA256SUMS.txt 核對檔案。
          NOTES
          gh release upload v0.5.0 release-output/33Works-LINE-Workbench-Setup-V0.5.0.exe release-output/33Works-LINE-Workbench-Portable-V0.5.0.zip release-output/SHA256SUMS.txt --clobber
          gh release edit v0.5.0 --title "33 Works LINE 自動化工作台 V0.5.0" --notes-file release-notes.md

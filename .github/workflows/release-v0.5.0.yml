name: Publish approved V0.5.0 files

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-v0.5.0.yml"
      - "downloads/approved-setup-parts/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore verified installer and historical portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-output
          cat downloads/approved-setup-parts/setup.part-{00,01,02,03,04} > release-output/33Works-LINE-Workbench-Setup-V0.5.0.exe
          curl --fail --location --retry 3 \
            --output release-output/33Works-LINE-Workbench-Portable-V0.5.0.zip \
            "https://github.com/dw5000tw-33/lineauto/raw/fb7c2efd165eb4e566aeb5712223bb76e9eb37db/downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip"
          cd release-output
          echo "7881a81ccd86ab7d9c0a52ffc8f69fed1a7793cb64fe6a1ebfea2fe0b74e8d51  33Works-LINE-Workbench-Setup-V0.5.0.exe" > SHA256SUMS.txt
          echo "0acb795d55dbb984839cac203a397462ecd2fc6013f3f671882a596ef794ad85  33Works-LINE-Workbench-Portable-V0.5.0.zip" >> SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Publish restored V0.5.0 files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<'NOTES'
          ## V0.5.0 已確認面板

          安裝版維持使用者確認的檔案。
          免安裝版已復原為 2026-09-23 18:31Z Release 成功發布紀錄中的 ZIP。
          檔名沿用 V0.5.0；下載後可使用 SHA256SUMS.txt 核對檔案。
          NOTES
          gh release upload v0.5.0 release-output/33Works-LINE-Workbench-Setup-V0.5.0.exe release-output/33Works-LINE-Workbench-Portable-V0.5.0.zip release-output/SHA256SUMS.txt --clobber
          gh release edit v0.5.0 --title "33 Works LINE 自動化工作台 V0.5.0" --notes-file release-notes.md

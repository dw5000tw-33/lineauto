name: Publish V0.5.0 release

on:
  push:
    branches: [main]
    paths:
      - "downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe"
      - "downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish release files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.5.0"
          TITLE="33 Works LINE 自動化工作台 V0.5.0"
          NOTES_FILE="${RUNNER_TEMP}/release-notes.md"
          cat > "${NOTES_FILE}" <<'NOTES'
          ## V0.5.0 正式版

          - 指定個人好友或群組
          - 支援文字與圖片檔案
          - 支援特定時間排程傳送
          - 七碼通行碼及單一裝置綁定
          - 啟動面板新增「自願支持」按鈕
          - 提供安裝版與 ZIP 免安裝版

          ### 使用提醒

          執行排程時，LINE 電腦版與工作台必須保持開啟；電腦不可登出、鎖定或進入睡眠。請勿密集發送或傳送垃圾訊息，以免 LINE 限制或停用帳號。

          目前程式尚未加入數位簽章，Windows 可能顯示未知發行者。請從官方網站或本 Release 下載，並核對檔案雜湊。
          NOTES

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}"               downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe               downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip               --clobber
            gh release edit "${TAG}" --title "${TITLE}" --notes-file "${NOTES_FILE}"
          else
            gh release create "${TAG}"               downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe               downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip               --title "${TITLE}"               --notes-file "${NOTES_FILE}"
          fi

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Prepare public files
        shell: bash
        run: |
          mkdir -p _site/downloads
          cp index.html styles.css script.js .nojekyll _site/
          cp -R assets _site/
          cp downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip _site/downloads/
          cat downloads/setup-parts/33Works-LINE-Workbench-Setup-V0.5.0.exe.part-* > _site/downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe
          echo "6a8389119fd2f2cd150121dda22b8b1e1fd6b6507e2b3dd123333a8763422b69  _site/downloads/33Works-LINE-Workbench-Setup-V0.5.0.exe" | sha256sum --check
          echo "efa1e771c83eaa2b36abbcb7ed40abb462a615f4e1e235e2cd00c4decd155d32  _site/downloads/33Works-LINE-Workbench-Portable-V0.5.0.zip" | sha256sum --check
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
